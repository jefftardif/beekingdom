<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Builder-B World Map Overlay</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; background: #0d100c; color: #f5edcf; }
    body { margin: 0; padding: 20px; }
    main { max-width: 1180px; margin: 0 auto; }
    h1 { margin: 0 0 10px; font-size: 22px; }
    p { margin: 0 0 12px; color: #d8cda5; line-height: 1.45; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 12px; }
    .layerToggles { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; color: #e7dcae; }
    .layerToggles label { display: inline-flex; gap: 5px; align-items: center; border: 1px solid #4e421d; padding: 5px 7px; background: #18170f; }
    button, input::file-selector-button {
      border: 1px solid #8b7429; background: #2d260f; color: #fff2b0; padding: 8px 10px; font: inherit; cursor: pointer;
    }
    button[aria-pressed="true"] { background: #69510d; border-color: #ffd24a; }
    .viewport { position: relative; width: min(100%, 1080px); aspect-ratio: 3 / 2; margin: 0 auto; overflow: hidden; border: 1px solid #6d5a20; background: #000; touch-action: none; }
    .mapLayer { position: absolute; inset: 0; transform-origin: 0 0; }
    .mapLayer img, .mapLayer svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .mapLayer img { object-fit: contain; }
    .territory { fill: rgba(255, 210, 74, 0.10); stroke: rgba(255, 220, 96, 0.78); stroke-width: 0.004; vector-effect: non-scaling-stroke; cursor: pointer; }
    .territory.hostile { fill: rgba(220, 34, 24, 0.18); stroke: rgba(255, 78, 56, 0.9); }
    .allianceTerritory { fill: rgba(54, 112, 255, 0.10); stroke: rgba(92, 145, 255, 0.85); stroke-width: 0.006; vector-effect: non-scaling-stroke; cursor: pointer; }
    .neutralZone { fill: rgba(235, 231, 214, 0.10); stroke: rgba(235, 231, 214, 0.78); stroke-width: 0.004; vector-effect: non-scaling-stroke; cursor: pointer; }
    .hostile { fill: rgba(255, 0, 0, 0.18); stroke: #ff4938; stroke-width: 0.006; vector-effect: non-scaling-stroke; cursor: pointer; }
    .route { fill: none; stroke: rgba(255,255,255,0.85); stroke-width: 0.006; stroke-dasharray: 0.012 0.010; vector-effect: non-scaling-stroke; cursor: pointer; }
    .hive { cursor: pointer; }
    .hive circle { stroke: #0c0902; stroke-width: 0.004; vector-effect: non-scaling-stroke; }
    .hive.player circle { fill: #ffd32f; }
    .hive.ally circle { fill: #2d69ff; }
    .hive.neutral circle { fill: #e8e4d6; }
    .hive.hostile circle { fill: #c31916; }
    .resource circle { fill: #c665ff; stroke: #1b0828; stroke-width: 0.004; vector-effect: non-scaling-stroke; cursor: pointer; }
    .poi circle { fill: #72e6ff; stroke: #06202a; stroke-width: 0.004; vector-effect: non-scaling-stroke; cursor: pointer; }
    .hostileNest circle { fill: #ff2d20; stroke: #2a0503; stroke-width: 0.006; vector-effect: non-scaling-stroke; cursor: pointer; }
    .wonder polygon { fill: #ffd86b; stroke: #2c1b00; stroke-width: 0.004; vector-effect: non-scaling-stroke; cursor: pointer; }
    .selectedHalo { fill: none; stroke: #fff36a; stroke-width: 0.012; vector-effect: non-scaling-stroke; filter: drop-shadow(0 0 12px rgba(255, 220, 80, 0.95)); pointer-events: none; }
    .hudReserve { fill: rgba(0,0,0,0.28); stroke: rgba(255,255,255,0.32); stroke-width: 0.002; vector-effect: non-scaling-stroke; pointer-events: none; }
    .label { fill: #fff7c8; stroke: #181000; stroke-width: 0.003; paint-order: stroke; font-size: 0.018px; font-weight: 700; pointer-events: none; }
    .panel { width: min(100%, 1080px); margin: 12px auto 0; padding: 12px; min-height: 48px; border: 1px solid #5d4a1b; background: #17180f; color: #f7e8a8; box-sizing: border-box; }
    .coordinateReadout { width: min(100%, 1080px); margin: 8px auto 0; color: #d8c982; font-size: 13px; font-family: Consolas, monospace; }
  </style>
</head>
<body>
  <main>
    <h1>Builder-B MMO World Map Overlay</h1>
    <p>Prototype isole. Pan/zoom local, zones chargees depuis JSON, aucune connexion au jeu officiel.</p>
    <div class="toolbar">
      <button id="reload" type="button">Charger JSON</button>
      <button id="zoomIn" type="button">Zoom +</button>
      <button id="zoomOut" type="button">Zoom -</button>
      <button id="reset" type="button">Reset</button>
      <button id="toggleHud" type="button" aria-pressed="true">HUD reserves</button>
      <input id="fileInput" type="file" accept="application/json,.json">
    </div>
    <div class="layerToggles" id="layerToggles" aria-label="Couches carte"></div>
    <div class="viewport" id="viewport">
      <div class="mapLayer" id="mapLayer">
        <img src="file:///C:/projets/beekingdom/carte.png" alt="MMO world map concept">
        <svg id="overlay" viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true"></svg>
      </div>
    </div>
    <div class="panel" id="panel">Aucun objet selectionne.</div>
    <div class="coordinateReadout" id="coordinateReadout">x=-- y=-- zoom=1.00</div>
  </main>

  <script>
    const jsonPath = "world_map_zones_v001.sample.json";
    const viewport = document.getElementById("viewport");
    const mapLayer = document.getElementById("mapLayer");
    const overlay = document.getElementById("overlay");
    const panel = document.getElementById("panel");
    const coordinateReadout = document.getElementById("coordinateReadout");
    const fileInput = document.getElementById("fileInput");
    const toggleHud = document.getElementById("toggleHud");
    let data = null;
    let selected = null;
    let showHud = true;
    let layerVisibility = {
      territories: true,
      allianceTerritories: true,
      neutralZones: true,
      hostileZones: true,
      routes: true,
      resources: true,
      wonders: true,
      hostileNests: true,
      pointsOfInterest: true,
      hives: true
    };
    let camera = { x: 0, y: 0, scale: 1 };
    let drag = null;

    document.getElementById("reload").addEventListener("click", loadDefaultJson);
    document.getElementById("zoomIn").addEventListener("click", () => zoomAt(1.2, viewport.clientWidth / 2, viewport.clientHeight / 2));
    document.getElementById("zoomOut").addEventListener("click", () => zoomAt(1 / 1.2, viewport.clientWidth / 2, viewport.clientHeight / 2));
    document.getElementById("reset").addEventListener("click", () => { camera = { x: 0, y: 0, scale: 1 }; applyCamera(); });
    toggleHud.addEventListener("click", () => { showHud = !showHud; toggleHud.setAttribute("aria-pressed", String(showHud)); render(); });
    fileInput.addEventListener("change", loadChosenJson);
    viewport.addEventListener("pointerdown", event => { drag = { id: event.pointerId, x: event.clientX, y: event.clientY, startX: camera.x, startY: camera.y }; viewport.setPointerCapture(event.pointerId); });
    viewport.addEventListener("pointermove", event => {
      updateCoordinateReadout(event);
      if (!drag || drag.id !== event.pointerId) return;
      camera.x = drag.startX + event.clientX - drag.x;
      camera.y = drag.startY + event.clientY - drag.y;
      clampCamera();
      applyCamera();
    });
    viewport.addEventListener("pointerdown", updateCoordinateReadout);
    viewport.addEventListener("pointerup", () => { drag = null; });
    viewport.addEventListener("wheel", event => {
      event.preventDefault();
      zoomAt(event.deltaY < 0 ? 1.12 : 1 / 1.12, event.offsetX, event.offsetY);
    }, { passive: false });

    loadDefaultJson();
    buildLayerToggles();

    async function loadDefaultJson() {
      try {
        const response = await fetch(jsonPath, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        setData(await response.json());
      } catch {
        panel.textContent = "Chargement direct bloque. Utiliser le selecteur pour ouvrir world_map_zones_v001.sample.json.";
      }
    }

    function loadChosenJson(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try { setData(JSON.parse(reader.result)); } catch { panel.textContent = "JSON invalide."; }
      };
      reader.readAsText(file);
    }

    function setData(payload) {
      data = payload;
      selected = null;
      render();
      updatePanel();
    }

    function render() {
      overlay.replaceChildren();
      if (!data) return;
      if (showHud) for (const region of data.hudReservedRegions || []) rect(region.rect, "hudReserve");
      if (layerVisibility.territories) for (const territory of data.territories || []) polygon(territory.polygon, `territory ${territory.state === "hostile" ? "hostile" : ""}`, () => select("territory", territory));
      if (layerVisibility.allianceTerritories) for (const territory of data.allianceTerritories || []) polygon(territory.polygon, "allianceTerritory", () => select("allianceTerritory", territory));
      if (layerVisibility.neutralZones) for (const zone of data.neutralZones || []) polygon(zone.polygon, "neutralZone", () => select("neutralZone", zone));
      if (layerVisibility.hostileZones) for (const zone of data.hostileZones || []) polygon(zone.polygon, "hostile", () => select("hostileZone", zone));
      if (layerVisibility.routes) for (const route of data.routes || []) polyline(route.points, "route", () => select("route", route));
      if (layerVisibility.resources) for (const resource of data.resources || []) marker(resource.position, "resource", resource.tapRadius || 0.018, () => select("resource", resource));
      if (layerVisibility.wonders) for (const wonder of data.wonders || []) star(wonder.position, wonder.tapRadius || 0.02, () => select("wonder", wonder));
      if (layerVisibility.hostileNests) for (const nest of data.hostileNests || []) marker(nest.position, "hostileNest", nest.tapRadius || 0.026, () => select("hostileNest", nest));
      if (layerVisibility.pointsOfInterest) for (const poi of data.pointsOfInterest || []) marker(poi.position, "poi", poi.tapRadius || 0.018, () => select("pointOfInterest", poi));
      if (layerVisibility.hives) for (const hive of data.hives || []) hiveMarker(hive);
      if (selected) drawHalo(selected.item);
    }

    function buildLayerToggles() {
      const container = document.getElementById("layerToggles");
      const labels = {
        territories: "Territoires",
        allianceTerritories: "Alliances",
        neutralZones: "Neutres",
        hostileZones: "Hostiles",
        routes: "Routes",
        resources: "Ressources",
        wonders: "Merveilles",
        hostileNests: "Nids",
        pointsOfInterest: "POI",
        hives: "Hives"
      };
      for (const [key, labelText] of Object.entries(labels)) {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "checkbox";
        input.checked = layerVisibility[key];
        input.addEventListener("change", () => {
          layerVisibility[key] = input.checked;
          render();
        });
        label.appendChild(input);
        label.append(labelText);
        container.appendChild(label);
      }
    }

    function select(type, item) {
      selected = { type, item };
      render();
      updatePanel();
    }

    function updatePanel() {
      if (!selected) { panel.textContent = "Aucun objet selectionne."; return; }
      const item = selected.item;
      panel.textContent = `${selected.type} | ${item.name || item.id} | id=${item.id} | state=${item.ownership || item.state || item.threatLevel || item.resourceType || item.wonderType || item.routeType || "draft"}`;
    }

    function polygon(points, className, onClick) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
      el.setAttribute("points", points.map(p => `${p.x},${p.y}`).join(" "));
      el.setAttribute("class", className);
      el.addEventListener("click", event => { event.stopPropagation(); onClick(); });
      overlay.appendChild(el);
    }

    function polyline(points, className, onClick) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
      el.setAttribute("points", points.map(p => `${p.x},${p.y}`).join(" "));
      el.setAttribute("class", className);
      el.addEventListener("click", event => { event.stopPropagation(); onClick(); });
      overlay.appendChild(el);
    }

    function rect(r, className) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      el.setAttribute("x", r.x); el.setAttribute("y", r.y); el.setAttribute("width", r.width); el.setAttribute("height", r.height); el.setAttribute("class", className);
      overlay.appendChild(el);
    }

    function marker(position, className, radius, onClick) {
      const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
      group.setAttribute("class", className);
      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute("cx", position.x); circle.setAttribute("cy", position.y); circle.setAttribute("r", radius);
      group.appendChild(circle);
      group.addEventListener("click", event => { event.stopPropagation(); onClick(); });
      overlay.appendChild(group);
    }

    function hiveMarker(hive) {
      marker(hive.position, `hive ${hive.ownership}`, hive.tapRadius || 0.022, () => select("hive", hive));
      label(hive.position, hive.tag || hive.name);
    }

    function star(position, radius, onClick) {
      const points = [];
      for (let i = 0; i < 10; i++) {
        const angle = -Math.PI / 2 + i * Math.PI / 5;
        const r = i % 2 === 0 ? radius : radius * 0.45;
        points.push({ x: position.x + Math.cos(angle) * r, y: position.y + Math.sin(angle) * r });
      }
      const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
      group.setAttribute("class", "wonder");
      const el = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
      el.setAttribute("points", points.map(p => `${p.x},${p.y}`).join(" "));
      group.appendChild(el);
      group.addEventListener("click", event => { event.stopPropagation(); onClick(); });
      overlay.appendChild(group);
    }

    function label(position, textValue) {
      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("class", "label");
      text.setAttribute("x", position.x + 0.018);
      text.setAttribute("y", position.y - 0.018);
      text.textContent = textValue;
      overlay.appendChild(text);
    }

    function drawHalo(item) {
      if (item.polygon) return polygon(item.polygon, "selectedHalo", () => {});
      if (item.points) return polyline(item.points, "selectedHalo", () => {});
      if (item.position) return marker(item.position, "selectedHalo", (item.tapRadius || 0.024) * 1.45, () => {});
    }

    function zoomAt(factor, px, py) {
      const next = Math.min(3.2, Math.max(0.85, camera.scale * factor));
      const worldX = (px - camera.x) / camera.scale;
      const worldY = (py - camera.y) / camera.scale;
      camera.x = px - worldX * next;
      camera.y = py - worldY * next;
      camera.scale = next;
      clampCamera();
      applyCamera();
    }

    function clampCamera() {
      const width = viewport.clientWidth;
      const height = viewport.clientHeight;
      const scaledW = width * camera.scale;
      const scaledH = height * camera.scale;
      camera.x = Math.min(0, Math.max(width - scaledW, camera.x));
      camera.y = Math.min(0, Math.max(height - scaledH, camera.y));
    }

    function applyCamera() {
      mapLayer.style.transform = `translate(${camera.x}px, ${camera.y}px) scale(${camera.scale})`;
    }

    function updateCoordinateReadout(event) {
      const rect = viewport.getBoundingClientRect();
      const screenX = event.clientX - rect.left;
      const screenY = event.clientY - rect.top;
      const mapX = (screenX - camera.x) / camera.scale / rect.width;
      const mapY = (screenY - camera.y) / camera.scale / rect.height;
      const clampedX = Math.min(1, Math.max(0, mapX));
      const clampedY = Math.min(1, Math.max(0, mapY));
      const px = Math.round(clampedX * 1536);
      const py = Math.round(clampedY * 1024);
      coordinateReadout.textContent = `map-normalized x=${clampedX.toFixed(4)} y=${clampedY.toFixed(4)} | pixels ${px},${py} | zoom=${camera.scale.toFixed(2)}`;
    }
  </script>
</body>
</html>
