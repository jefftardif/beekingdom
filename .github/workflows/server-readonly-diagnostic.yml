name: BeeKingdom read-only server diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/diag/server-readonly-20261114'
    runs-on: [self-hosted, beekingdom-deploy]
    timeout-minutes: 3
    steps:
      - name: Read binary source version metadata
        shell: powershell
        run: |
          $rows=@()
          foreach($n in @('BeeKingdom.Server','BeeKingdom.HiveOperations','BeeKingdom.Persistence')){
          $p=Join-Path 'C:\inetpub\BeeKingdomApi' ($n+'.dll')
          $v=[Diagnostics.FileVersionInfo]::GetVersionInfo($p)
          $row=@{name=$n;fileVersion=$v.FileVersion;productVersion=$v.ProductVersion}
          $pdb=Join-Path 'C:\inetpub\BeeKingdomApi' ($n+'.pdb')
          if(Test-Path $pdb){$f=Get-Item $pdb;$row.pdbBytes=$f.Length;$row.pdbModifiedUtc=$f.LastWriteTimeUtc.ToString('o')}
          $rows+=$row
          }
          @{utc=[DateTime]::UtcNow.ToString('o');versions=$rows}|ConvertTo-Json -Depth 4 -Compress
