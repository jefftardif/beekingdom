name: BeeKingdom read-only server diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/diag/server-readonly-20261114'
    runs-on: [self-hosted, beekingdom-deploy]
    timeout-minutes: 3
    steps:
      - name: Read SQL client package metadata only
        shell: powershell
        run: |
          $d=Get-Content 'C:\inetpub\BeeKingdomApi\BeeKingdom.Server.deps.json' -Raw|ConvertFrom-Json
          $p=@($d.libraries.PSObject.Properties.Name|Where-Object {$_ -match '^Microsoft.Data.SqlClient/'})
          @{package=$p;runtime=$d.runtimeTarget.name;utc=[DateTime]::UtcNow.ToString('o')}|ConvertTo-Json -Compress
