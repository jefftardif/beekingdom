name: Deploy BeeKingdomApi

# Manual promotion, not push-to-main - see conversation with Jeff (2026-08-19):
# main gets ordinary commits/PRs, this workflow only runs when something is
# pushed to (or merged into) `deploy`. That one extra deliberate step before
# anything reaches the live IIS site is worth the few seconds it costs.
on:
  push:
    branches:
      - deploy

jobs:
  build:
    # Cloud-hosted - the .NET SDK never runs on the production server, only
    # here. Publish output is framework-dependent; IIS's ANCM in-process
    # hosting model on the server handles the rest, same as it already does
    # for the site this replaces.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: dotnet publish Server/src/BeeKingdom.Server/BeeKingdom.Server.csproj -c Release -o publish-output

      - uses: actions/upload-artifact@v4
        with:
          name: beekingdom-api
          path: publish-output/
          retention-days: 14

  deploy:
    needs: build
    # Self-hosted runner on 104.129.128.136, scoped to this repo only.
    # Adjust the label below to whatever was actually chosen when the runner
    # was registered (GitHub defaults to `self-hosted` + OS/arch tags unless
    # a custom label was added at registration time).
    runs-on: [self-hosted, beekingdom-deploy]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: beekingdom-api
          path: publish-output

      - name: Take the site offline
        shell: powershell
        run: |
          "<html><body>Deploying, back in a moment.</body></html>" | Out-File -FilePath "C:\inetpub\BeeKingdomApi\app_offline.htm" -Encoding utf8 -Force
          Import-Module WebAdministration
          # Stop-WebAppPool throws if the pool is already stopped (e.g. someone took the
          # site offline by hand before the run) instead of treating that as a no-op -
          # only call it when there's actually something to stop.
          if ((Get-WebAppPoolState -Name "BeeKingdomApi").Value -ne "Stopped") {
            Stop-WebAppPool -Name "BeeKingdomApi"
          }

          # Stop-WebAppPool returns as soon as the stop is *requested* - the in-process
          # w3wp.exe worker can take a moment to actually exit and release its file
          # handles (BeeKingdom.*.dll etc.), which is why the copy step below used to
          # fail with "being used by another process". Poll for the real Stopped state
          # first, then force-kill any worker process still holding this pool's files if
          # it hasn't exited on its own after a reasonable wait.
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-WebAppPoolState -Name "BeeKingdomApi").Value -ne "Stopped" -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 1
          }
          Get-CimInstance Win32_Process -Filter "Name = 'w3wp.exe'" |
            Where-Object { $_.CommandLine -like '*BeeKingdomApi*' } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 2

      - name: Copy published files
        shell: powershell
        run: |
          $exclude = @('app_offline.htm', 'web.config')
          Get-ChildItem -Path "publish-output" -Recurse -File |
            Where-Object { $exclude -notcontains $_.Name } |
            ForEach-Object {
              $target = $_.FullName.Replace((Resolve-Path "publish-output").Path, "C:\inetpub\BeeKingdomApi")
              New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
              # The app pool being Stopped doesn't guarantee every file handle is released
              # instantly - a moment-late antivirus scan on the freshly-written DLL is a
              # common cause too. Retry briefly instead of guessing which process to kill.
              $attempts = 0
              while ($true) {
                try { Copy-Item -Path $_.FullName -Destination $target -Force -ErrorAction Stop; break }
                catch {
                  $attempts++
                  if ($attempts -ge 5) { throw }
                  Start-Sleep -Seconds 3
                }
              }
            }

      - name: Bring the site back online
        shell: powershell
        run: |
          Import-Module WebAdministration
          # Same "already in target state throws" quirk as Stop-WebAppPool, symmetric fix.
          if ((Get-WebAppPoolState -Name "BeeKingdomApi").Value -ne "Started") {
            Start-WebAppPool -Name "BeeKingdomApi"
          }
          Remove-Item -Path "C:\inetpub\BeeKingdomApi\app_offline.htm" -Force -ErrorAction SilentlyContinue

      - name: Smoke test
        shell: powershell
        run: |
          Start-Sleep -Seconds 5
          # Windows PowerShell 5.1 / .NET Framework doesn't always enable TLS 1.2 by
          # default for this process - force it explicitly rather than relying on the
          # OS default. Certificate trust is NOT bypassed here: api-ops.beekingdomgame.com
          # uses a real Cloudflare Origin CA certificate (Full strict), so a failed trust
          # check here is a genuine signal worth catching, not noise to silence.
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.SecurityProtocolType]::Tls12
          $response = Invoke-WebRequest -Uri "https://api-ops.beekingdomgame.com/" -UseBasicParsing -TimeoutSec 15
          if ($response.StatusCode -ne 200) { throw "Health check failed: $($response.StatusCode)" }
